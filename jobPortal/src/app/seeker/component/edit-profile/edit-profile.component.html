<div class="page">
<app-header variant="seeker"></app-header>
<div class="app-shell">
<app-sidebar variant="seeker"></app-sidebar>
<main class="main">

<div class="page-title">Edit Profile</div>
<div class="form-card">
  <div class="card-row">
    <div class="field"><label>First name</label><input [value]="jobSeeker?.firstName"></div>
    <div class="field"><label>Last name</label><input [value]="jobSeeker?.lastName"></div>
  </div>
  <div class="field"><label>Email</label><input [value]="jobSeeker?.email"></div>
  <div class="field"><label>Location</label><input [value]="jobSeeker?.location"></div>
  <div class="field"><label>Skills (comma separated)</label><input [value]="jobSeeker?.skills?.join(', ')"></div>
  <div class="form-actions">
    <a routerLink="/seeker/profile-jobseeker" class="btn btn-primary">Save changes</a>
    <a routerLink="/seeker/profile-jobseeker" class="btn btn-secondary">Cancel</a>
  </div>
  <div class="danger-zone">
    <button class="btn btn-outline-danger">Delete my account</button>
  </div>
</div>

</main>
</div>
</div>
