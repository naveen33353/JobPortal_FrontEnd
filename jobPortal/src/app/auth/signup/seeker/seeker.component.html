<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Job Seeker · HireHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

</head>

<body>
  <div class="page">
    <header class="topnav">
      <div class="wrap">
        <a href="index.html" class="brand"><span class="brand-dot"></span>HireHub</a>
        <nav class="nav-links">
          <a href="jobs.html">Find Jobs</a>
          <a href="companies.html">Companies</a>
          <a href="register-company.html">For Employers</a>
        </nav>
        <div class="nav-actions">
          <a (click)="login()" class="btn btn-ghost-dark btn-sm">Log in</a>
          <a (click)="signUp()" class="btn btn-primary btn-sm">Sign up</a>
        </div>
      </div>
    </header>

    <div class="auth-wrap">
     <form [formGroup]="regSeeker" (ngSubmit)="onSubmit()">
       <div class="auth-card">
        <h2>Create your Job Seeker account</h2>
        <div class="card-row">

          <div class="field"><label>First name</label><input formControlName="firstName" placeholder="Aditi"></div>
          <div class="field"><label>Last name</label><input formControlName="lastName" placeholder="Menon"></div>
        </div>
        <div class="field"><label>Email</label><input formControlName="email" type="email" placeholder="aditi@email.com"></div>
        <div class="field"><label>Password</label><input formControlName="password" type="password" placeholder="••••••••"></div>
        <div class="field"><label>Location</label><input formControlName="location" placeholder="Kochi, IN"></div>
        <div class="field"><label>Primary skills</label><input formArrayName="skills" placeholder="Java, React"></div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </div>
     </form>
    </div>

    <footer class="site-footer">
      <div class="wrap">
        <span>© 2026 HireHub</span>
        <span class="mono-label" style="color:var(--muted-lt)">com.aitrich.JobPortalSystem</span>
      </div>
    </footer>
  </div>
</body>

</html>
