<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · HireHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">


</head>
<body>
<div class="page">
<header class="topnav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="brand-dot"></span>HireHub</a>
    <nav class="nav-links">
      <a href="jobs.html">Find Jobs</a>
      <a href="companies.html">Companies</a>
      <a href="register-company.html">For Employers</a>
    </nav>
    <div class="nav-actions">
      <a routerLink="login" class="btn btn-ghost-dark btn-sm">Log in</a>
      <a (click)="signup()" class="btn btn-primary btn-sm">Sign up</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="mono-label" style="color:var(--amber-dk)">Welcome back</span>
    <h2>Log in to HireHub</h2>
    <div class="field"><label>Email</label><input type="email" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input type="password" placeholder="••••••••"></div>
    <button class="btn btn-primary btn-block">Log in</button>
    <p class="muted" style="font-size:13px;margin-top:18px;text-align:center;">No account? <a href="register.html" style="color:var(--indigo);font-weight:600;">Register as Job Seeker or Company</a>.</p>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 HireHub</span>
    <span class="mono-label" style="color:var(--muted-lt)">com.aitrich.JobPortalSystem</span>
  </div>
</footer>
</div>
</body>
</html>
